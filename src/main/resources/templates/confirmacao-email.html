<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f4f4f4;
          margin: 0;
          padding: 0;
        }

        .container {
          max-width: 600px;
          margin: 40px auto;
          background: #ffffff;
          border-radius: 10px;
          padding: 30px;
          text-align: center;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2 {
          color: #333;
        }

        p {
          color: #555;
          font-size: 16px;
        }

        .btn {
          display: inline-block;
          margin-top: 20px;
          padding: 12px 25px;
          background-color: #007bff;
          color: #fff !important;
          text-decoration: none;
          border-radius: 6px;
          font-weight: bold;
        }

        .btn:hover {
          background-color: #0056b3;
        }

        .footer {
          margin-top: 30px;
          font-size: 12px;
          color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Confirme seu e-mail</h2>
    <p>Olá, obrigado por se cadastrar.</p>
    <p>Para ativar sua conta, clique no botão abaixo:</p>
    <a href="{{linkConfirmacao}}" class="btn">Confirmar E-mail</a>

    <div class="footer">
        <p>Se você não criou esta conta, pode ignorar este e-mail.</p>
    </div>
</div>
</body>
</html>
